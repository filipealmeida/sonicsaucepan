[workspace]
members = [
  "crates/ss_core",
  "crates/ss_audio",
  "crates/ss_wasm",
  "crates/ss_cli",
  "crates/ss_repl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Sonic Saucepan Team"]

[workspace.dependencies]
# shared crates
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14"

# audio/runtime
cpal = "0.15"
hound = "3.5"
midir = "0.10"

# wasm bridge
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# internal workspace crates
ss_core = { path = "crates/ss_core" }
ss_audio = { path = "crates/ss_audio" }